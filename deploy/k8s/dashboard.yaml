# The dashboard on GKE. The LoadBalancer Service is the single public entry
# point for the page and the API behind it (/, /static/*, /api/*, /ws).
#
# Jenkins replaces IMAGE_PLACEHOLDER with the image it just built. By hand:
#   sed "s|IMAGE_PLACEHOLDER|$REPO_PATH/sdv-fleet-dashboard:latest|" \
#       deploy/k8s/dashboard.yaml | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdv-dashboard
  labels:
    app: sdv-dashboard
spec:
  replicas: 1          # each replica simulates its own fleet in memory
  selector:
    matchLabels:
      app: sdv-dashboard
  template:
    metadata:
      labels:
        app: sdv-dashboard
    spec:
      containers:
        - name: dashboard
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sdv-dashboard
  labels:
    app: sdv-dashboard
spec:
  type: LoadBalancer
  selector:
    app: sdv-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
