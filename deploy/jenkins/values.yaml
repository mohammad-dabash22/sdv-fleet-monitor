# helm install sdv-jenkins -f deploy/jenkins/values.yaml jenkinsci/jenkins --wait
#
# The release name becomes the hostname agents call back on
# (http://sdv-jenkins:8080, sdv-jenkins-agent:50000).

controller:
  # additionalPlugins extends the chart's defaults; installPlugins replaces them.
  additionalPlugins:
    - credentials-binding:latest
    - github:latest
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "1"
      memory: "4Gi"
  javaOpts: "-Xmx3g"            # below the memory limit, or the pod is OOM-killed
  serviceType: LoadBalancer

agent:
  # Fallback only; the Jenkinsfile declares its own build pod.
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

persistence:
  size: 20Gi

serviceAccount:
  name: sdv-jenkins
