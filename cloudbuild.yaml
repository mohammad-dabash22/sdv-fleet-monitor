# Builds the dashboard image. Needed because the Dockerfile is not at the root
# of the source, which `gcloud builds submit -t` requires.
#
#   gcloud builds submit --config cloudbuild.yaml --substitutions _IMAGE=<image> .

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/docker/dashboard.Dockerfile
      - --tag=${_IMAGE}
      - .

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
