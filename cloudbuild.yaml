# Cloud Build config for the dashboard image.
#
# `gcloud builds submit -t <image>` only works when the Dockerfile sits at the
# root of the uploaded source. Ours is in deploy/docker/ while the build context
# has to be the repository root (the image needs cloud/, vehicle/ and fakes/),
# so the build step is spelled out here instead.
#
#   gcloud builds submit --config cloudbuild.yaml \
#       --substitutions _IMAGE=$REPO_PATH/sdv-fleet-dashboard:latest .

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/docker/dashboard.Dockerfile
      - --tag=${_IMAGE}
      - .

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY   # no bucket needed, and --suppress-logs stays quiet
